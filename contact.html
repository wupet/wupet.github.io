<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="fixed-banner">
        <div class="left-items">
            <a href="index.html" class="custom-link1">Home</a>
            <button onclick="toggleStyleSheet()" class="bb">
                <svg id = "moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="moon-icon">
                    <g transform="translate(-2,2)">
                        <path d="M21 12.79A9 9 0 0 1 11.21 3a7 7 0 1 0 9.79 9.79z"/>
                    </g>
                </svg>
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="sun-icon">
                    <circle cx="12" cy="12" r="5"/>
                    <g stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="4"/>
                        <line x1="12" y1="20" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
                        <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="4" y2="12"/>
                        <line x1="20" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
                        <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
                    </g>
                </svg>
            </button>
        </div>
        <div class="right-items">
            <a href="contact.html" class="custom-link1">Contact Me</a>
        </div>
    </div>
  <!-- Header -->
  <header class="banner">
    <h1>Contact Me/AI page</h1>
    <p>I'd love to hear from you!</p>
  </header>

  <!-- Contact Info -->
  <section class="contact-info">
    <h2>Get in Touch</h2>
    <p><strong>Phone:</strong> (123) 456-7890</p>
    <p><strong>Email:</strong> me@example.com</p>
  </section>

  <!-- Contact Form -->
  <section class="contact-form">
    <h2>Send a Message</h2>
    <form>
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </section>>
</body>
</html>
